# Google Cloud Build — JDI 포털을 서울(asia-northeast3) Cloud Run 에 배포한다.
#
# 수동 배포:
#   gcloud builds submit --config cloudbuild.yaml .
# GitHub 트리거(master push)로도 같은 파일을 그대로 쓴다.
#
# 공개 환경변수(NEXT_PUBLIC_*)는 클라이언트 번들에 박히므로 빌드 시점에 필요하다.
# 저장소에 값을 두지 않기 위해 Secret Manager 에서 읽어 --build-arg 로만 전달한다.

substitutions:
  _REGION: asia-northeast3
  _SERVICE: jdi-portal
  _REPO: jdi

options:
  # Next.js 빌드는 CPU/메모리를 많이 쓴다. 기본 머신은 느리고 OOM 위험이 있다.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: NEXT_PUBLIC_SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_VAPID_PUBLIC_KEY/versions/latest
      env: NEXT_PUBLIC_VAPID_PUBLIC_KEY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$$NEXT_PUBLIC_SUPABASE_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="$$NEXT_PUBLIC_VAPID_PUBLIC_KEY" \
          -t "$$IMAGE:$BUILD_ID" \
          -t "$$IMAGE:latest" \
          .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      # 사내 포털이지만 로그인 게이트는 앱이 처리한다(Cloud Run 단계에서 막으면 로그인 화면도 못 본다).
      - --allow-unauthenticated
      # 성능 불변조건 유지: 항상 1대를 켜 두고 CPU 를 상시 할당해야
      # instrumentation.ts 의 pg 풀 warm-up 과 2분 주기 keepalive 가 계속 돈다.
      - --min-instances=1
      - --max-instances=4
      - --no-cpu-throttling
      - --cpu=1
      - --memory=1Gi
      - --cpu-boost
      - --execution-environment=gen2
      # SSR 은 단일 스레드라 한 대에 과하게 몰면 오히려 느려진다.
      - --concurrency=40
      - --timeout=120
      - --service-account=jdi-run@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,NEXT_PUBLIC_VAPID_PUBLIC_KEY=NEXT_PUBLIC_VAPID_PUBLIC_KEY:latest,DATABASE_URL=DATABASE_URL:latest,ACCOUNT_VAULT_KEY=ACCOUNT_VAULT_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest

timeout: 1800s
